apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: saludo-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fgaticadev/lab-kub-sboot.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: saludo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
